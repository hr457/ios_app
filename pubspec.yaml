name: safl
description: SAFL Collection
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  connectivity_plus: ^6.1.1
  sqflite: ^2.4.1
  path: ^1.9.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  pdf: ^3.11.1
  printing: ^5.13.4
  flutter_local_notifications: ^22.0.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/setialogo.jfif"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
